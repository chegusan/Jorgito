name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # The pipeline scripts import the Hermes source (agent.pet.*), which is
      # not available in CI. Byte-compilation validates their syntax without
      # importing Hermes; the unit tests exercise the pure, deterministic
      # helpers via a minimal stub (see tests/conftest.py).
      - name: Byte-compile all scripts
        run: python -m py_compile scripts/*.py

      - name: Lint (ruff)
        run: ruff check scripts tests

      - name: Unit tests (pytest)
        run: python -m pytest -q
